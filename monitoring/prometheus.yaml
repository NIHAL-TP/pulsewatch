global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: pulsewatch
    dns_sd_configs:
      - names: ["app.pulsewatch.local"]
        type: A
        port: 5000
        refresh_interval: 15s

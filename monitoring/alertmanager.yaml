route:
  receiver: slack
  group_by: ['alertname']
  group_wait: 30s        # wait to collect related alerts before the first notification
  group_interval: 5m     # wait before notifying about new alerts added to a group
  repeat_interval: 4h    # re-notify if an alert is still firing

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_webhook   # secret kept out of this file
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          severity: {{ .Labels.severity }}
          {{ end }}

inhibit_rules:
  # If a critical alert is firing, suppress warning alerts (likely just symptoms)
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
